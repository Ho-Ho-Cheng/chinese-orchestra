<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>國樂合奏曲《山河序》</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(255, 236, 180, 0.22), transparent 35%),
        linear-gradient(135deg, #0f172a, #3f1d0b, #111827);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 940px;
      padding: 36px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(16px);
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 36px;
      letter-spacing: 1px;
    }

    .subtitle {
      color: #e5e7eb;
      line-height: 1.8;
      margin-bottom: 26px;
    }

    .stage {
      height: 240px;
      margin: 28px 0;
      border-radius: 24px;
      background:
        radial-gradient(circle, rgba(251, 191, 36, 0.28), transparent 45%),
        linear-gradient(to top, rgba(0,0,0,0.45), rgba(255,255,255,0.06));
      display: flex;
      justify-content: center;
      align-items: end;
      gap: 18px;
      padding-bottom: 32px;
      overflow: hidden;
    }

    .instrument {
      animation: idle 1.4s infinite ease-in-out;
      opacity: 0.95;
    }

    .dizi {
      width: 34px;
      height: 150px;
      border-radius: 999px;
      background: linear-gradient(#bbf7d0, #15803d);
    }

    .erhu {
      width: 42px;
      height: 165px;
      border-radius: 999px 999px 18px 18px;
      background: linear-gradient(#fef3c7, #92400e);
    }

    .pipa {
      width: 68px;
      height: 130px;
      border-radius: 48% 48% 38% 38%;
      background: linear-gradient(#fde68a, #b45309);
    }

    .yangqin {
      width: 120px;
      height: 76px;
      border-radius: 18px;
      background: linear-gradient(#fef9c3, #854d0e);
    }

    .guzheng {
      width: 145px;
      height: 54px;
      border-radius: 999px;
      background: linear-gradient(#fed7aa, #7c2d12);
    }

    .drum {
      width: 92px;
      height: 82px;
      border-radius: 18px 18px 999px 999px;
      background: linear-gradient(#fecaca, #991b1b);
    }

    .playing .instrument {
      animation: play 0.35s infinite ease-in-out;
    }

    .playing .dizi {
      animation-duration: 0.22s;
    }

    .playing .yangqin,
    .playing .pipa {
      animation-duration: 0.25s;
    }

    @keyframes idle {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    @keyframes play {
      0%, 100% { transform: scaleY(1) translateY(0); }
      50% { transform: scaleY(1.12) translateY(-12px); }
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      padding: 15px 30px;
      border-radius: 999px;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.25s;
    }

    button:hover {
      transform: translateY(-3px);
      filter: brightness(1.08);
    }

    .play {
      background: linear-gradient(135deg, #22c55e, #15803d);
    }

    .stop {
      background: linear-gradient(135deg, #ef4444, #991b1b);
    }

    .status {
      margin-top: 20px;
      color: #fde68a;
      font-weight: bold;
    }

    .info {
      margin-top: 26px;
      padding: 18px;
      border-radius: 18px;
      background: rgba(255,255,255,0.08);
      text-align: left;
      line-height: 1.8;
      color: #e5e7eb;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 14px;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.14);
      text-align: left;
    }

    th {
      color: #fde68a;
      background: rgba(255,255,255,0.08);
    }

    footer {
      margin-top: 22px;
      color: #d1d5db;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>國樂合奏曲《山河序》</h1>

    <p class="subtitle">
      原創國樂合奏，旋律以西洋交響曲式發展：主題、對比主題、發展部、再現部與尾聲。<br>
      使用笛子、二胡群、琵琶、揚琴、古箏、低音拉弦與打擊聲部。
    </p>

    <div class="stage" id="stage">
      <div class="instrument dizi" title="笛子"></div>
      <div class="instrument erhu" title="二胡群"></div>
      <div class="instrument pipa" title="琵琶"></div>
      <div class="instrument yangqin" title="揚琴"></div>
      <div class="instrument guzheng" title="古箏"></div>
      <div class="instrument drum" title="打擊"></div>
    </div>

    <div class="controls">
      <button class="play" onclick="playPiece()">▶ 播放</button>
      <button class="stop" onclick="stopPiece()">■ 停止</button>
    </div>

    <div class="status" id="status">尚未播放</div>

    <div class="info">
      <strong>曲式設計：</strong>
      <table>
        <tr>
          <th>段落</th>
          <th>西洋形式功能</th>
          <th>國樂配器</th>
        </tr>
        <tr>
          <td>導奏</td>
          <td>建立調性與氣氛</td>
          <td>古箏泛音、低音拉弦、堂鼓弱奏</td>
        </tr>
        <tr>
          <td>主題 A</td>
          <td>第一主題，雄壯有力</td>
          <td>二胡群與笛子齊奏</td>
        </tr>
        <tr>
          <td>主題 B</td>
          <td>第二主題，抒情對比</td>
          <td>笛子主旋律、揚琴分解音型</td>
        </tr>
        <tr>
          <td>發展部</td>
          <td>動機切分、轉調、堆疊</td>
          <td>琵琶掃弦、打擊推進、聲部對答</td>
        </tr>
        <tr>
          <td>再現與尾聲</td>
          <td>主題回歸並擴大</td>
          <td>全團合奏，打擊強奏收束</td>
        </tr>
      </table>
    </div>

    <footer>
      此曲為原創旋律與原創和聲設計，使用 Web Audio API 即時合成。
    </footer>
  </div>

  <script>
    let audioCtx;
    let masterGain;
    let nodes = [];
    let stopTimer = null;
    let isPlaying = false;

    const BPM = 112;
    const beat = 60 / BPM;
    const eighth = beat / 2;
    const sixteenth = beat / 4;

    const notes = {
      C2: 65.41, D2: 73.42, E2: 82.41, F2: 87.31, G2: 98.00, A2: 110.00, B2: 123.47,
      C3: 130.81, D3: 146.83, E3: 164.81, F3: 174.61, G3: 196.00, A3: 220.00, B3: 246.94,
      C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392.00, A4: 440.00, B4: 493.88,
      C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99, A5: 880.00, B5: 987.77,
      C6: 1046.50, D6: 1174.66, E6: 1318.51, F6: 1396.91, G6: 1567.98
    };

    async function setupAudio() {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      if (audioCtx.state === "suspended") {
        await audioCtx.resume();
      }

      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.7;

      const compressor = audioCtx.createDynamicsCompressor();
      compressor.threshold.value = -18;
      compressor.knee.value = 24;
      compressor.ratio.value = 4;
      compressor.attack.value = 0.006;
      compressor.release.value = 0.24;

      masterGain.connect(compressor);
      compressor.connect(audioCtx.destination);
    }

    function addNode(node) {
      nodes.push(node);
      return node;
    }

    function envelope(gain, start, duration, volume, attack, release) {
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(volume, start + attack);
      gain.gain.setValueAtTime(volume, Math.max(start + attack, start + duration - release));
      gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
    }

    function tone(freq, start, duration, options = {}) {
      const osc = addNode(audioCtx.createOscillator());
      const gain = addNode(audioCtx.createGain());
      const filter = addNode(audioCtx.createBiquadFilter());

      osc.type = options.type || "sine";
      osc.frequency.setValueAtTime(freq, start);

      if (options.slideTo) {
        osc.frequency.linearRampToValueAtTime(options.slideTo, start + Math.min(duration * 0.45, 0.12));
      }

      if (options.detune) {
        osc.detune.setValueAtTime(options.detune, start);
      }

      filter.type = options.filterType || "lowpass";
      filter.frequency.setValueAtTime(options.filterFreq || 6000, start);
      filter.Q.value = options.q || 0.7;

      envelope(
        gain,
        start,
        duration,
        options.volume || 0.18,
        options.attack || 0.02,
        options.release || 0.18
      );

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(masterGain);

      osc.start(start);
      osc.stop(start + duration + 0.04);
    }

    function dizi(noteName, start, duration, volume = 0.22) {
      const freq = notes[noteName];

      tone(freq, start, duration, {
        type: "sine",
        volume,
        attack: 0.025,
        release: 0.18,
        filterType: "bandpass",
        filterFreq: 2400,
        q: 4
      });

      tone(freq * 2, start, duration * 0.9, {
        type: "triangle",
        volume: volume * 0.36,
        attack: 0.018,
        release: 0.13,
        filterType: "bandpass",
        filterFreq: 3600,
        q: 3
      });
    }

    function erhuGroup(noteName, start, duration, volume = 0.23) {
      const freq = notes[noteName];

      tone(freq * 0.996, start, duration, {
        type: "sawtooth",
        volume,
        attack: 0.07,
        release: 0.28,
        filterType: "bandpass",
        filterFreq: 1200,
        q: 2.8,
        detune: -5
      });

      tone(freq * 1.004, start, duration, {
        type: "triangle",
        volume: volume * 0.75,
        attack: 0.08,
        release: 0.25,
        filterType: "bandpass",
        filterFreq: 1450,
        q: 2.5,
        detune: 6
      });
    }

    function pipa(noteName, start, duration = 0.18, volume = 0.18) {
      const freq = notes[noteName];

      tone(freq, start, duration, {
        type: "triangle",
        volume,
        attack: 0.004,
        release: 0.16,
        filterType: "highpass",
        filterFreq: 600,
        q: 0.8
      });

      tone(freq * 2.01, start, duration * 0.55, {
        type: "sine",
        volume: volume * 0.32,
        attack: 0.002,
        release: 0.08,
        filterType: "highpass",
        filterFreq: 1000
      });
    }

    function yangqin(noteName, start, duration = 0.22, volume = 0.14) {
      const freq = notes[noteName];

      tone(freq, start, duration, {
        type: "triangle",
        volume,
        attack: 0.003,
        release: 0.2,
        filterType: "highpass",
        filterFreq: 900
      });

      tone(freq * 1.5, start, duration * 0.7, {
        type: "sine",
        volume: volume * 0.22,
        attack: 0.002,
        release: 0.12,
        filterType: "highpass",
        filterFreq: 1200
      });
    }

    function guzheng(noteName, start, duration = 0.5, volume = 0.16) {
      const freq = notes[noteName];

      tone(freq, start, duration, {
        type: "triangle",
        volume,
        attack: 0.006,
        release: 0.42,
        filterType: "lowpass",
        filterFreq: 4200
      });

      tone(freq * 2, start + 0.018, duration * 0.6, {
        type: "sine",
        volume: volume * 0.28,
        attack: 0.004,
        release: 0.24,
        filterType: "lowpass",
        filterFreq: 5000
      });
    }

    function bassString(noteName, start, duration, volume = 0.2) {
      const freq = notes[noteName];

      tone(freq, start, duration, {
        type: "sawtooth",
        volume,
        attack: 0.08,
        release: 0.35,
        filterType: "lowpass",
        filterFreq: 850
      });
    }

    function drum(start, accent = false) {
      const osc = addNode(audioCtx.createOscillator());
      const gain = addNode(audioCtx.createGain());

      osc.type = "sine";
      osc.frequency.setValueAtTime(accent ? 150 : 210, start);
      osc.frequency.exponentialRampToValueAtTime(accent ? 62 : 110, start + 0.09);

      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(accent ? 0.46 : 0.25, start + 0.006);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + (accent ? 0.48 : 0.22));

      osc.connect(gain);
      gain.connect(masterGain);

      osc.start(start);
      osc.stop(start + 0.55);
    }

    function cymbal(start, volume = 0.12) {
      const bufferSize = audioCtx.sampleRate * 0.22;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);

      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }

      const source = addNode(audioCtx.createBufferSource());
      const gain = addNode(audioCtx.createGain());
      const filter = addNode(audioCtx.createBiquadFilter());

      filter.type = "highpass";
      filter.frequency.value = 5200;

      gain.gain.setValueAtTime(volume, start);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.22);

      source.buffer = buffer;
      source.connect(filter);
      filter.connect(gain);
      gain.connect(masterGain);

      source.start(start);
      source.stop(start + 0.24);
    }

    function playMelody(line, start, instrumentFn, volume = 0.24) {
      line.forEach(([note, offset, dur]) => {
        instrumentFn(note, start + offset * beat, dur * beat * 0.95, volume);
      });
    }

    function scheduleOstinato(start, bars, mode = 0) {
      const patterns = [
        ["D4", "A4", "E5", "A4"],
        ["F4", "C5", "G5", "C5"],
        ["G4", "D5", "A5", "D5"],
        ["Bb3", "F4", "C5", "F4"]
      ];

      for (let bar = 0; bar < bars; bar++) {
        const chord = patterns[(bar + mode) % patterns.length];
        const barStart = start + bar * beat * 4;

        for (let i = 0; i < 8; i++) {
          const t = barStart + i * eighth;
          const note = chord[i % chord.length];

          if (bar % 2 === 0) {
            yangqin(note, t, 0.22, i % 2 === 0 ? 0.13 : 0.09);
          } else {
            pipa(note, t, 0.18, i % 2 === 0 ? 0.15 : 0.1);
          }
        }
      }
    }

    function scheduleBassAndDrums(start, bars, roots) {
      for (let bar = 0; bar < bars; bar++) {
        const barStart = start + bar * beat * 4;
        const root = roots[bar % roots.length];

        bassString(root, barStart, beat * 2.8, 0.19);

        drum(barStart, true);

        if (bar % 2 === 1) {
          drum(barStart + beat * 2, false);
        }

        if (bar % 4 === 3) {
          cymbal(barStart + beat * 3.5, 0.09);
        }
      }
    }

    function scheduleIntro(start) {
      const zheng = [
        ["D4", 0, 1], ["A4", 0.5, 1], ["D5", 1, 1.2],
        ["E5", 2, 1], ["A4", 2.5, 1], ["G4", 3, 1.2],
        ["C5", 4, 1], ["F5", 4.5, 1], ["D5", 5, 1.2],
        ["G4", 6, 1], ["A4", 6.5, 1], ["D5", 7, 1.6]
      ];

      zheng.forEach(([n, o, d]) => {
        guzheng(n, start + o * beat, d * beat, 0.15);
      });

      bassString("D2", start, beat * 4, 0.16);
      bassString("F2", start + beat * 4, beat * 4, 0.16);
      drum(start + beat * 7.5, true);
    }

    function scheduleMainThemeA(start) {
      const themeA = [
        ["D5",0,1],["E5",1,0.5],["G5",1.5,0.5],["A5",2,1],["G5",3,1],
        ["E5",4,0.75],["D5",4.75,0.25],["C5",5,1],["D5",6,2],

        ["F5",8,1],["G5",9,0.5],["A5",9.5,0.5],["C6",10,1],["A5",11,1],
        ["G5",12,0.75],["F5",12.75,0.25],["D5",13,1],["E5",14,2]
      ];

      playMelody(themeA, start, erhuGroup, 0.25);

      const fluteCounter = [
        ["A5",2,0.5],["C6",2.5,0.5],["D6",3,1],
        ["G5",6,0.5],["A5",6.5,0.5],["C6",7,1],
        ["C6",10,0.5],["D6",10.5,0.5],["E6",11,1],
        ["A5",14,0.5],["C6",14.5,0.5],["D6",15,1]
      ];

      playMelody(fluteCounter, start, dizi, 0.18);

      scheduleOstinato(start, 4, 0);
      scheduleBassAndDrums(start, 4, ["D2", "F2", "G2", "C3"]);
    }

    function scheduleThemeB(start) {
      const themeB = [
        ["A4",0,1.5],["C5",1.5,0.5],["D5",2,1],["F5",3,1],
        ["E5",4,1.5],["D5",5.5,0.5],["C5",6,1],["A4",7,1],

        ["G4",8,1.5],["A4",9.5,0.5],["C5",10,1],["D5",11,1],
        ["F5",12,1],["E5",13,1],["C5",14,2]
      ];

      playMelody(themeB, start, dizi, 0.24);

      const innerStrings = [
        ["D4",0,2],["F4",2,2],["E4",4,2],["A4",6,2],
        ["C4",8,2],["D4",10,2],["F4",12,2],["E4",14,2]
      ];

      playMelody(innerStrings, start, erhuGroup, 0.16);
      scheduleOstinato(start, 4, 1);
      scheduleBassAndDrums(start, 4, ["Bb2", "F2", "C3", "G2"]);
    }

    function scheduleDevelopment(start) {
      /*
        發展部：把主題 A 的「上行四度 + 級進」動機切小，
        以不同調式區域輪替，形成西洋交響曲式的發展感。
      */
      const fragments = [
        ["D5",0,0.5],["G5",0.5,0.5],["A5",1,0.5],["G5",1.5,0.5],
        ["F5",2,0.5],["C6",2.5,0.5],["A5",3,0.5],["F5",3.5,0.5],

        ["E5",4,0.5],["A5",4.5,0.5],["C6",5,0.5],["A5",5.5,0.5],
        ["G5",6,0.5],["D6",6.5,0.5],["C6",7,0.5],["A5",7.5,0.5],

        ["Bb4",8,0.5],["F5",8.5,0.5],["G5",9,0.5],["Bb5",9.5,0.5],
        ["C5",10,0.5],["G5",10.5,0.5],["A5",11,0.5],["C6",11.5,0.5],

        ["D5",12,0.5],["A5",12.5,0.5],["D6",13,0.5],["C6",13.5,0.5],
        ["A5",14,0.5],["G5",14.5,0.5],["F5",15,0.5],["E5",15.5,0.5]
      ];

      fragments.forEach(([n, o, d], i) => {
        const fn = i % 2 === 0 ? pipa : yangqin;
        fn(n, start + o * beat, d * beat * 0.8, 0.17);
      });

      const longLine = [
        ["D5",0,2],["F5",2,2],["E5",4,2],["G5",6,2],
        ["Bb4",8,2],["C5",10,2],["D5",12,2],["A5",14,2]
      ];

      playMelody(longLine, start, erhuGroup, 0.2);
      scheduleBassAndDrums(start, 4, ["D2", "E2", "Bb2", "A2"]);

      for (let bar = 0; bar < 4; bar++) {
        const t = start + bar * beat * 4;
        drum(t, true);
        drum(t + beat * 1.5, false);
        cymbal(t + beat * 3.75, 0.08);
      }
    }

    function scheduleRecapAndCoda(start) {
      const recap = [
        ["D5",0,1],["E5",1,0.5],["G5",1.5,0.5],["A5",2,1],["D6",3,1],
        ["C6",4,0.75],["A5",4.75,0.25],["G5",5,1],["A5",6,2],

        ["F5",8,1],["G5",9,0.5],["A5",9.5,0.5],["C6",10,1],["D6",11,1],
        ["A5",12,1],["G5",13,1],["D5",14,2]
      ];

      playMelody(recap, start, erhuGroup, 0.28);
      playMelody(recap, start, dizi, 0.2);

      scheduleOstinato(start, 4, 2);
      scheduleBassAndDrums(start, 4, ["D2", "C3", "F2", "D2"]);

      const codaStart = start + beat * 16;

      const coda = [
        ["D5",0,0.5],["E5",0.5,0.5],["G5",1,0.5],["A5",1.5,0.5],
        ["C6",2,0.5],["D6",2.5,0.5],["A5",3,0.5],["G5",3.5,0.5],
        ["D6",4,1],["A5",5,1],["D5",6,2]
      ];

      playMelody(coda, codaStart, dizi, 0.24);
      playMelody(coda, codaStart, erhuGroup, 0.27);

      for (let i = 0; i < 8; i++) {
        const t = codaStart + i * eighth;
        pipa(["D4", "A4", "D5", "G5"][i % 4], t, 0.16, 0.18);
        yangqin(["F4", "A4", "C5", "D5"][i % 4], t + sixteenth, 0.16, 0.13);
      }

      const finalTime = codaStart + beat * 8;

      ["D2", "D3", "A3", "D4", "F4", "A4", "D5"].forEach((n, i) => {
        guzheng(n, finalTime + i * 0.035, beat * 3.2, 0.17);
      });

      erhuGroup("D5", finalTime, beat * 3.2, 0.28);
      dizi("D6", finalTime + 0.08, beat * 2.8, 0.22);
      bassString("D2", finalTime, beat * 3.4, 0.26);

      drum(finalTime, true);
      cymbal(finalTime + beat * 0.5, 0.16);
      drum(finalTime + beat * 1.5, true);
    }

    async function playPiece() {
      stopPiece();
      await setupAudio();

      isPlaying = true;
      document.getElementById("stage").classList.add("playing");
      document.getElementById("status").textContent = "正在播放：國樂合奏曲《山河序》";

      const start = audioCtx.currentTime + 0.25;

      const introStart = start;
      const themeAStart = introStart + beat * 8;
      const themeBStart = themeAStart + beat * 16;
      const devStart = themeBStart + beat * 16;
      const recapStart = devStart + beat * 16;

      scheduleIntro(introStart);
      scheduleMainThemeA(themeAStart);
      scheduleThemeB(themeBStart);
      scheduleDevelopment(devStart);
      scheduleRecapAndCoda(recapStart);

      stopTimer = setTimeout(() => {
        if (isPlaying) {
          document.getElementById("stage").classList.remove("playing");
          document.getElementById("status").textContent = "播放結束";
          isPlaying = false;
        }
      }, 46000);
    }

    function stopPiece() {
      if (stopTimer) {
        clearTimeout(stopTimer);
        stopTimer = null;
      }

      if (audioCtx) {
        try {
          nodes.forEach(node => {
            try {
              if (node.stop) node.stop();
            } catch (e) {}

            try {
              if (node.disconnect) node.disconnect();
            } catch (e) {}
          });

          nodes = [];

          if (masterGain && audioCtx.state !== "closed") {
            masterGain.gain.setValueAtTime(masterGain.gain.value, audioCtx.currentTime);
            masterGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.15);
          }

          setTimeout(() => {
            if (audioCtx && audioCtx.state !== "closed") {
              audioCtx.close();
            }
          }, 180);
        } catch (e) {}
      }

      isPlaying = false;
      document.getElementById("stage").classList.remove("playing");
      document.getElementById("status").textContent = "已停止";
    }
  </script>
